# pnpm keeps its settings here rather than in package.json.
#
# pnpm does not run a dependency's install scripts unless it is approved below
# (`pnpm approve-builds` writes these entries). esbuild's postinstall is what
# puts the platform binary in place for Vite, so without this every install
# fails the pre-run dependency check and `vite build` never gets to start.
# Approve a package here only when its build produces something the app needs.
allowBuilds:
  esbuild: true

# Floors for transitive dependencies with published advisories, until the
# packages that pull them in require the patched versions themselves.
overrides:
  # GHSA-jp82-f5mq-hwhp, via @tanstack/react-router.
  seroval: ^1.6.3
  # GHSA-68fv-2mgg-jv7q, via vite's postcss.
  source-map-js: ^1.2.2
  # GHSA-mrhx-c7xc-m3w5, via @tanstack/router-plugin.
  zod: ^4.6.6
  # GHSA-xjj6-f33q-929c, via jsdom.
  undici: ^8.12.2
